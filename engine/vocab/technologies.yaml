  - { id: spark, label: Apache Spark, category: data, logo: si:apachespark, aliases: [pyspark, apache-spark] }
  - { id: dbt, label: dbt, category: data, logo: octicon:workflow }
  - { id: airflow, label: Apache Airflow, category: data, logo: si:apacheairflow }
  - { id: duckdb, label: DuckDB, category: data, logo: si:duckdb }

  # Machine learning and AI
  - { id: scikit-learn, label: scikit-learn, category: ml, logo: si:scikitlearn, aliases: [sklearn, scikitlearn] }
