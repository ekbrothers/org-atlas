# Checks data and makes sure the site builds on every pull request.
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run validate

      # The committed schema and agent definitions must match the vocabulary files.
      - name: Schema and agent are up to date
        run: |
          npm run generate
          git diff --exit-code schema/ agent/ .claude/agents/ AGENTS.md || (echo "::error::Generated files are out of date. Run npm run generate and commit." && exit 1)

      - run: npx astro build

      # The upstream toolkit repo must never contain user-owned files, so that
      # people who clone it can pull updates without merge conflicts.
      # This step only runs where the repository variable ORG_ATLAS_UPSTREAM is "true"
      # (set it in the toolkit's own repository, never in your copy).
      - name: Upstream guard (no user-owned files)
        if: vars.ORG_ATLAS_UPSTREAM == 'true'
        run: |
          for p in data atlas.config.yaml overrides .vscode; do
            if [ -e "$p" ]; then
              echo "::error::'$p' is user-owned and must not be committed to the upstream toolkit repo."
              exit 1
            fi
          done
